- name: Calculate days until the next Wednesday
  ansible.builtin.set_fact:
    # now(fmt='%w') gets the current day of the week (0=Sunday, 1=Monday ... 3=Wednesday).
    # This if/else logic finds exactly how many days are left until the next occurrence of a Wednesday.
    days_until_wed: >-
      {%- set today = now(fmt='%w') | int -%}
      {%- set offset = 3 - today -%}
      {%- if offset <= 0 -%}
        {{ offset + 7 }}
      {%- else -%}
        {{ offset }}
      {%- endif -%}

- name: Set the target date for the *following* Wednesday
  ansible.builtin.set_fact:
    # We take current time, add the days until the *next* Wednesday, plus an extra 7 days 
    # to ensure it targets the *following* week. Everything is converted to seconds (* 86400).
    # (Note: If you actually meant tomorrow, simply remove the '+ 7' from this formula).
    target_day: "{{ '%Y-%m-%d' | strftime((now(fmt='%s') | int) + ((days_until_wed | int + 7) * 86400)) }}"

- name: Set ServiceNow start and end date variables
  ansible.builtin.set_fact:
    # Setting the start window to 7:00 PM and assuming a 2-hour window for the end time.
    start_date: "{{ target_day }} 19:00:00"
    end_date: "{{ target_day }} 21:00:00"

- name: Create change request
  servicenow.itsm.change_request:
    instance:
      host: "{{ snow_instance }}"
      username: "{{ snow_username }}"
      password: "{{ snow_password }}"
    type: normal
    state: new
    requested_by: AAP
    short_description: "{{ short_description }}"
    description: "{{ short_description }}"
    assignment_group: Software
    priority: "{{ priority }}"
    risk: "{{ risk }}"
    other: 
      start_date: "{{ start_date }}"
      end_date: "{{ end_date }}"
      cmdb_ci: "{{ hostname }}"
  register: change_request


- name: Create change request
  servicenow.itsm.change_request:
    instance:
      host: "{{ snow_instance }}"
      username: "{{ snow_username }}"
      password: "{{ snow_password }}"
    number: "{{ change_request.record.number }}" # The ticket you want to update
    other:
      justification: "{{ justification }}"
      implementation_plan: "{{ implementation_plan }}"
      risk_impact_analysis: "{{ risk_impact_analysis }}"
      test_plan: "{{ test_plan }}"
      backout_plan: "Execute Rollback playbook to restore previous state."

- name: Update Work Notes and Additional Comments
  servicenow.itsm.change_request:
    instance:
      host: "{{ snow_instance }}"
      username: "{{ snow_username }}"
      password: "{{ snow_password }}"
    number: "{{ change_request.record.number }}"
    other:
      work_notes: "{{ work_notes }}"
      comments: "{{ comments }}"
  register: chg_notes_result
